name: Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android/OpenU60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Repo has no Gradle wrapper; AGP 8.7.3 needs Gradle 8.9+
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Add missing proguard file
        run: touch app/proguard-rules.pro

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: OpenU60-debug-apk
          path: mobile/android/OpenU60/app/build/outputs/apk/debug/*.apk
          retention-days: 30
